sources:
  ebay:
    enabled: true
    base_url: "https://www.ebay.com"
    max_results: 50
  facebook_marketplace:
    enabled: true
    # Requires manual browsing or FB API access
    note: "Use local radius search"
  offerup:
    enabled: true
    base_url: "https://offerup.com"
  mercari:
    enabled: true
    base_url: "https://www.mercari.com"
  swappa:
    enabled: true
    base_url: "https://swappa.com"

ai:
  ollama:
    model: "llama3.2"
    vision_model: "llama3.2-vision"
    base_url: "http://localhost:11434"
  listing:
    title_max_chars: 80
    include_caveats: true
    include_seo_keywords: true
  photo_assessment:
    enabled: true
    check_for:
      - "back glass cracks"
      - "frame dents"
      - "water damage indicators"
      - "missing screws"
      - "non-original parts"

repair_parts_sources:
  - name: "MobileSentrix"
    url: "https://www.mobilesentrix.com"
    note: "Good quality, fast shipping, wholesale pricing"
  - name: "InjuredGadgets"
    url: "https://www.injuredgadgets.com"
    note: "Best for bulk orders, wholesale accounts"
  - name: "Amazon"
    url: "https://www.amazon.com"
    note: "Good for singles, Prime returns if DOA"
